version: '3'

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  restore:
    desc: Restore .NET local tools and NuGet package dependencies
    cmds:
      - dotnet tool restore
      - dotnet restore RTFExporter.sln

  build:
    desc: Build the RTFExporter solution
    deps: [restore]
    cmds:
      - dotnet build RTFExporter.sln --configuration Debug

  build:release:
    desc: Build the RTFExporter solution in Release configuration
    deps: [restore]
    cmds:
      - dotnet build RTFExporter.sln --configuration Release

  test:
    desc: Run all unit tests in the RTFExporter solution
    deps: [build]
    cmds:
      - dotnet test RTFExporter.sln --no-build --verbosity normal

  test:coverage:
    desc: Run unit tests with code coverage and generate HTML report in TestResults/html
    deps: [build]
    cmds:
      - rm -rf TestResults
      - dotnet test RTFExporter.sln --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - dotnet reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:TestResults/html" "-reporttypes:Html;TextSummary"
      - cat TestResults/html/Summary.txt

  clean:
    desc: Clean build outputs, test coverage results, and generated documentation files
    cmds:
      - dotnet clean RTFExporter.sln
      - rm -rf RTFExporter.docs/_site TestResults
      - rm -f RTFExporter.docs/api/*.yml RTFExporter.docs/api/.manifest

  docs:gen:
    desc: Generate DocFX static documentation site
    deps: [restore]
    cmds:
      - dotnet docfx RTFExporter.docs/docfx.json

  docs:serve:
    desc: Generate and serve DocFX documentation locally with live reload (http://localhost:8080)
    deps: [restore]
    cmds:
      - dotnet docfx RTFExporter.docs/docfx.json --serve
