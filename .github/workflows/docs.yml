name: Deploy DocFX Documentation to GitHub Pages

on:
  push:
    branches: [ master, main ]
    paths:
      - 'RTFExporter/**'
      - 'RTFExporter.docs/**'
      - '.github/workflows/docs.yml'
      - 'dotnet-tools.json'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build C# library and generated XML docs
        run: dotnet build RTFExporter/RTFExporter.csproj --configuration Release

      - name: Generate DocFX static documentation site
        run: dotnet docfx RTFExporter.docs/docfx.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: RTFExporter.docs/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
